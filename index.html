<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="日々の支出を素早く記録・管理できるモバイル家計簿アプリ">
    <meta name="theme-color" content="#00B4DB">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="家計簿">
    <title>家計簿管理アプリ</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>💰</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- 週間グラフセクション -->
        <section class="chart-section">
            <canvas id="weeklyChart"></canvas>
        </section>

        <!-- サマリーセクション -->
        <section class="summary-section">
            <div class="date-display" id="dateDisplay"></div>
            <div class="total-amount" id="todayTotal">¥0</div>
        </section>

        <!-- 日付ナビゲーション -->
        <section class="date-navigation">
            <button class="nav-btn" id="prevDayBtn">&lt; 前日</button>
            <button class="nav-btn" id="nextDayBtn">翌日 &gt;</button>
        </section>

        <!-- 支出一覧 -->
        <section class="expenses-section">
            <div id="expensesList" class="expenses-list">
                <!-- 支出カードがここに動的に追加されます -->
            </div>
            <div id="emptyMessage" class="empty-message">
                まだ支出が記録されていません
            </div>
        </section>

        <!-- フローティングアクションボタン -->
        <button class="fab" id="fabBtn" aria-label="支出を追加">
            <span class="fab-icon">+</span>
        </button>

        <!-- 支出追加モーダル -->
        <div class="modal" id="addExpenseModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>支出を追加</h2>
                    <button class="close-btn" id="closeModal">&times;</button>
                </div>
                <form id="expenseForm">
                    <div class="form-group">
                        <label for="amount">金額 *</label>
                        <input type="number" id="amount" name="amount" required min="1" placeholder="1000">
                    </div>

                    <div class="form-group">
                        <label>カテゴリ *</label>
                        <input type="hidden" id="category" name="category" required>
                        <div id="categoryButtons" class="category-buttons">
                            <!-- カテゴリボタンがここに動的に追加されます -->
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="memo">メモ</label>
                        <textarea id="memo" name="memo" rows="3" placeholder="メモ（任意）"></textarea>
                    </div>

                    <button type="submit" class="submit-btn">追加する</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
