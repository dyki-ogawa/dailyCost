<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="日々の支出を素早く記録・管理できるモバイル家計簿アプリ">
    <meta name="theme-color" content="#00B4DB">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="家計簿">
    <title>家計簿管理アプリ</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>💰</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- ログイン状態表示 -->
        <section class="auth-section" id="authSection">
            <div class="auth-logged-out" id="authLoggedOut">
                <button class="google-login-btn" id="googleLoginBtn">
                    <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path><path fill="none" d="M0 0h48v48H0z"></path></svg>
                    <span>Googleでログイン</span>
                </button>
                <p class="auth-note">ログインすると複数端末でデータを同期できます</p>
            </div>
            <div class="auth-logged-in" id="authLoggedIn" style="display: none;">
                <div class="user-info">
                    <img id="userPhoto" class="user-photo" alt="User photo">
                    <span id="userName" class="user-name"></span>
                </div>
                <button class="logout-btn" id="logoutBtn">ログアウト</button>
            </div>
        </section>

        <!-- 週間グラフセクション -->
        <section class="chart-section">
            <canvas id="weeklyChart"></canvas>
        </section>

        <!-- サマリーセクション -->
        <section class="summary-section">
            <div class="date-display" id="dateDisplay"></div>
            <div class="total-amount" id="todayTotal">¥0</div>
        </section>

        <!-- 日付ナビゲーション -->
        <section class="date-navigation">
            <button class="nav-btn" id="prevDayBtn">&lt; 前日</button>
            <button class="nav-btn" id="nextDayBtn">翌日 &gt;</button>
        </section>

        <!-- 支出一覧 -->
        <section class="expenses-section">
            <div id="expensesList" class="expenses-list">
                <!-- 支出カードがここに動的に追加されます -->
            </div>
            <div id="emptyMessage" class="empty-message">
                まだ支出が記録されていません
            </div>
        </section>

        <!-- フローティングアクションボタン -->
        <button class="fab" id="fabBtn" aria-label="支出を追加">
            <span class="fab-icon">+</span>
        </button>

        <!-- 支出追加モーダル -->
        <div class="modal" id="addExpenseModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>支出を追加</h2>
                    <button class="close-btn" id="closeModal">&times;</button>
                </div>
                <form id="expenseForm">
                    <div class="form-group">
                        <label for="amount">金額 *</label>
                        <input type="number" id="amount" name="amount" required min="1" placeholder="1000">
                    </div>

                    <div class="form-group">
                        <label>カテゴリ *</label>
                        <input type="hidden" id="category" name="category" required>
                        <div id="categoryButtons" class="category-buttons">
                            <!-- カテゴリボタンがここに動的に追加されます -->
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="memo">メモ</label>
                        <textarea id="memo" name="memo" rows="3" placeholder="メモ（任意）"></textarea>
                    </div>

                    <button type="submit" class="submit-btn">追加する</button>
                </form>
            </div>
        </div>

        <!-- 支出編集モーダル -->
        <div class="modal" id="editExpenseModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>支出を編集</h2>
                    <button class="close-btn" id="closeEditModal">&times;</button>
                </div>
                <form id="editExpenseForm">
                    <input type="hidden" id="editExpenseId">
                    <div class="form-group">
                        <label for="editAmount">金額 *</label>
                        <input type="number" id="editAmount" name="amount" required min="1" placeholder="1000">
                    </div>

                    <div class="form-group">
                        <label>カテゴリ *</label>
                        <input type="hidden" id="editCategory" name="category" required>
                        <div id="editCategoryButtons" class="category-buttons">
                            <!-- カテゴリボタンがここに動的に追加されます -->
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="editMemo">メモ</label>
                        <textarea id="editMemo" name="memo" rows="3" placeholder="メモ（任意）"></textarea>
                    </div>

                    <button type="submit" class="submit-btn">更新する</button>
                    <button type="button" class="delete-btn" id="deleteExpenseBtn">削除する</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- Firebase設定 -->
    <script src="firebase-config.js"></script>

    <!-- アプリケーションロジック -->
    <script src="app.js"></script>
</body>
</html>
