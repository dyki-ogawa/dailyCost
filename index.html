<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家計簿管理アプリ</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- ヘッダー -->
        <header class="app-header">
            <h1>💰 家計簿</h1>
        </header>

        <!-- 週間グラフセクション -->
        <section class="chart-section">
            <canvas id="weeklyChart"></canvas>
        </section>

        <!-- サマリーセクション -->
        <section class="summary-section">
            <div class="date-display" id="dateDisplay"></div>
            <div class="total-amount">
                <span class="label">今日の合計:</span>
                <span class="amount" id="todayTotal">¥0</span>
            </div>
        </section>

        <!-- 支出一覧 -->
        <section class="expenses-section">
            <h2>今日の支出</h2>
            <div id="expensesList" class="expenses-list">
                <!-- 支出カードがここに動的に追加されます -->
            </div>
            <div id="emptyMessage" class="empty-message">
                まだ支出が記録されていません
            </div>
        </section>

        <!-- フローティングアクションボタン -->
        <button class="fab" id="fabBtn" aria-label="支出を追加">
            <span class="fab-icon">+</span>
        </button>

        <!-- 支出追加モーダル -->
        <div class="modal" id="addExpenseModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>支出を追加</h2>
                    <button class="close-btn" id="closeModal">&times;</button>
                </div>
                <form id="expenseForm">
                    <div class="form-group">
                        <label for="amount">金額 *</label>
                        <input type="number" id="amount" name="amount" required min="1" placeholder="1000">
                    </div>

                    <div class="form-group">
                        <label for="category">カテゴリ *</label>
                        <select id="category" name="category" required>
                            <option value="">選択してください</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="memo">メモ</label>
                        <textarea id="memo" name="memo" rows="3" placeholder="メモ（任意）"></textarea>
                    </div>

                    <button type="submit" class="submit-btn">追加する</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
